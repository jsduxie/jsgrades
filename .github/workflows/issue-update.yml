name: Update issues with commit information

on:
  workflow_run:
    workflows: ["CI - Lint & Test"]
    types:
      - completed

permissions:
  checks: read
  contents: read
  issues: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download code from triggering run
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download test summary artifact
        uses: actions/download-artifact@v4
        with:
          name: test-summary
          path: ./artifact

      - name: Read test summary
        id: test-summary
        run: |
          SUMMARY=$(cat ./artifact/test-summary.txt)
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Extract issue number from branch
        id: vars
        run: |
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          ISSUE_NUM=$(echo "$BRANCH_NAME" | grep -oE '[0-9]+')
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT

      - name: Get latest commit message
        id: commit
        run: |
          git fetch origin ${{ steps.vars.outputs.branch_name }}
          git checkout ${{ steps.vars.outputs.branch_name }}
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT

      - name: Get diff stats (line changes)
        id: diff
        run: |
          CHANGED=$(git diff --shortstat HEAD~1 HEAD)
          echo "diff_summary=$CHANGED" >> $GITHUB_OUTPUT

      - name: Get CI status for latest commit
        id: ci-status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = "${{ github.event.workflow_run.head_sha }}";
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });

            const ciCheck = checks.check_runs.find(c =>
              c.name.toLowerCase().includes("ci") || c.name.toLowerCase().includes("lint")
            );

            if (ciCheck) {
              core.setOutput("status", ciCheck.conclusion);
              core.setOutput("ci_url", ciCheck.html_url);
            } else {
              core.setOutput("status", "unknown");
              core.setOutput("ci_url", `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`);
            }

      - name: Comment on issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.vars.outputs.issue_number }}
          body: |
            🚀 A new push was made to branch `${{ steps.vars.outputs.branch_name }}`

            **Commit Message:**  
            `${{ steps.commit.outputs.message }}`

            **Changes:**  
            `${{ steps.diff.outputs.diff_summary }}`

            **CI Test Status:**  
            🧪 `${{ steps.ci-status.outputs.status }}`
            [View CI Run](${{ steps.ci-status.outputs.ci_url }})

            **Test Results:**  
            ```
            ${{ steps.test-summary.outputs.summary }}
            ```

            [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }})
