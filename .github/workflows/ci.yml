name: CI - Lint & Test

on:
  push:
    branches: [dev, test, main, issue-*]
  pull_request:
    branches: [main, dev, test]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Debug - list files in jsgrades
        run: ls -la jsgrades

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug current dir and contents
        run: |
          pwd
          ls -la
          ls -la jsgrades

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: jsgrades/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: jsgrades


      - name: Lint
        run: npm run lint
        working-directory: jsgrades

      - name: Check formatting
        run: npm run format
        working-directory: jsgrades

      - name: Test
        run: |
          echo "Running all tests..."
          npm test
        working-directory: jsgrades
        env:
          NEXT_PUBLIC_FIREBASE_apiKey: ${{ secrets.NEXT_PUBLIC_FIREBASE_APIKEY }}
          NEXT_PUBLIC_FIREBASE_authDomain: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTHDOMAIN }}
          NEXT_PUBLIC_FIREBASE_projectId: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECTID }}
          NEXT_PUBLIC_FIREBASE_storageBucket: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGEBUCKET }}
          NEXT_PUBLIC_FIREBASE_messagingSenderId: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID }}
          NEXT_PUBLIC_FIREBASE_appId: ${{ secrets.NEXT_PUBLIC_FIREBASE_APPID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_USER: ${{ secrets.DB_USER }}
          STATUS: DEV
          FIREBASE_SDK_KEY: ${{ secrets.FIREBASE_SDK_KEY }}
          NODE_ENV: test

      - name: Extract test summary
        if: always()
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'jsgrades/test-results.json';
          const results = JSON.parse(fs.readFileSync(path, 'utf-8'));
          
          const summary = {
            total: results.numTotalTests,
            passed: results.numPassedTests,
            failed: results.numFailedTests,
            skipped: results.numPendingTests
          };
          
          fs.writeFileSync('jsgrades/test-summary.txt', JSON.stringify(summary, null, 2));
          EOF

      - name: Upload test summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: jsgrades/test-summary.txt

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jsduxie/jsgrades
