name: CI - Lint, Test & Update Issue

on:
  push:
    branches: [dev, test, main, issue-*]
  pull_request:
    branches: [main, dev, test]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: jsgrades/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: jsgrades

      - name: Lint
        run: npm run lint
        working-directory: jsgrades

      - name: Check formatting
        run: npm run format
        working-directory: jsgrades

      - name: Run tests
        run: npm test -- --coverage --json --outputFile=test-results.json
        working-directory: jsgrades
        continue-on-error: true
        env:
          NEXT_PUBLIC_FIREBASE_apiKey: ${{ secrets.NEXT_PUBLIC_FIREBASE_APIKEY }}
          NEXT_PUBLIC_FIREBASE_authDomain: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTHDOMAIN }}
          NEXT_PUBLIC_FIREBASE_projectId: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECTID }}
          NEXT_PUBLIC_FIREBASE_storageBucket: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGEBUCKET }}
          NEXT_PUBLIC_FIREBASE_messagingSenderId: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID }}
          NEXT_PUBLIC_FIREBASE_appId: ${{ secrets.NEXT_PUBLIC_FIREBASE_APPID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_USER: ${{ secrets.DB_USER }}
          STATUS: DEV
          FIREBASE_SDK_KEY: ${{ secrets.FIREBASE_SDK_KEY }}
          NODE_ENV: test

      - name: Extract test summary
        if: always()
        working-directory: jsgrades
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'test-results.json';
          const results = JSON.parse(fs.readFileSync(path, 'utf-8'));

          const summary = {
            total: results.numTotalTests,
            passed: results.numPassedTests,
            failed: results.numFailedTests,
            skipped: results.numPendingTests
          };

          fs.writeFileSync('test-summary.txt', JSON.stringify(summary, null, 2));
          EOF

      - name: Upload test summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: jsgrades/test-summary.txt

      - name: Upload coverage artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: jsgrades/coverage/**
          if-no-files-found: ignore

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jsduxie/jsgrades
          files: jsgrades/coverage/lcov.info

  issue-update:
    name: Update Issue with CI Info
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/heads/issue-')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Fetch at least 2 commits to enable HEAD~1 comparison

      - name: Download test summary artifact
        uses: actions/download-artifact@v4
        with:
          name: test-summary
          path: ./artifact

      - name: Read test summary
        id: test-summary
        run: |
          SUMMARY=$(cat ./artifact/test-summary.txt | tr -d '\n' | tr -d ' ')
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Extract issue number from branch
        id: vars
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          ISSUE_NUM=$(echo "$BRANCH_NAME" | grep -oE '[0-9]+')
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT

      - name: Get latest commit message
        id: commit
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT

      - name: Get diff stats (line changes)
        id: diff
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --shortstat HEAD~1 HEAD)
          else
            CHANGED=$(git show --shortstat --format= HEAD)
          fi
          if [ -z "$CHANGED" ]; then
            CHANGED="No diff available"
          fi
          echo "diff_summary=$CHANGED" >> $GITHUB_OUTPUT

      - name: Comment on issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.vars.outputs.issue_number }}
          body: |
            A new push was made to branch `${{ steps.vars.outputs.branch_name }}`

            **Commit Message:**  
            `${{ steps.commit.outputs.message }}`

            **Changes:**  
            `${{ steps.diff.outputs.diff_summary }}`

            **Test Results:**  
            ```
            ${{ steps.test-summary.outputs.summary }}
            ```

            [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
