name: CI - Lint & Test

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [main, dev, test]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug current dir and contents
        run: |
          pwd
          ls -la
          ls -la jsgrades

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm i
        working-directory: jsgrades

      - name: Lint
        run: npm run lint
        working-directory: jsgrades

      - name: Check formatting
        run: npm run format
        working-directory: jsgrades

      - name: Test
        run: |
          echo "Running tests..."
          npm test
        working-directory: jsgrades

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsgrades-test-and-lint-logs
          path: jsgrades/test-reports/
          retention-days: 7

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jsduxie/jsgrades
